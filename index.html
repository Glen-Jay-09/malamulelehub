<style>
:root{--g:#075C43;--e:#087F5B;--o:#F58220;--c:#F5F8F4;--ink:#123A32;--line:#d9e5dd;--mut:#5b7168}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--c);color:var(--ink);line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:0 18px}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--g);text-decoration:none;font-size:18px}.brand img{width:36px;height:36px;border-radius:9px}
nav a{color:var(--ink);text-decoration:none;font-size:14px;font-weight:650;margin-left:14px}nav a:hover{color:var(--e)}
@media(max-width:560px){nav{display:none}}
.hero{background:linear-gradient(135deg,var(--g),var(--e));color:#fff;padding:44px 0 62px}
.hero h1{font-size:clamp(28px,6vw,42px);line-height:1.1;margin:0 0 12px;letter-spacing:-1px}.hero p{margin:0;max-width:560px;color:#dff0e8;font-size:17px}
.tag{display:inline-block;background:var(--o);color:#fff;font-weight:750;font-size:12px;padding:4px 10px;border-radius:99px;margin-bottom:14px}
.cards{display:grid;gap:14px;margin-top:-34px;padding-bottom:28px}@media(min-width:700px){.cards{grid-template-columns:repeat(3,1fr)}}
.card{background:#fff;border:1px solid var(--line);border-top:5px solid var(--o);border-radius:14px;padding:20px;text-decoration:none;color:inherit;box-shadow:0 6px 18px rgba(7,92,67,.08);display:block}
.card h2{margin:0 0 6px;font-size:20px;color:var(--g)}.card p{margin:0 0 14px;color:var(--mut);font-size:14px}
.btn{display:inline-block;background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:750;font-size:15px;cursor:pointer;text-decoration:none}.btn:hover{background:var(--e)}.btn[disabled]{opacity:.6;cursor:wait}
.note{color:var(--mut);font-size:13px;padding-bottom:30px}
.sv-head{padding:26px 0 6px}.sv-head a{color:var(--e);font-weight:650;text-decoration:none;font-size:14px}.sv-head h1{font-size:clamp(26px,5vw,36px);letter-spacing:-.8px;margin:10px 0 6px;color:var(--g)}.sv-head p{margin:0 0 4px;color:var(--mut)}
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin:18px 0}
.sec>h2{font-size:16px;color:#fff;background:var(--g);margin:-20px -20px 18px;padding:12px 20px;border-radius:13px 13px 0 0}
.q{margin-bottom:22px}.q:last-child{margin-bottom:0}.t{display:block;font-weight:700;margin-bottom:4px}.req{color:var(--o)}.hint{font-size:12px;color:var(--mut);margin:0 0 8px}
input[type=text],input[type=tel],input[type=email],textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid #bcd0c4;border-radius:10px;background:#fff;color:var(--ink);margin-bottom:8px}
input:focus,textarea:focus{outline:2px solid var(--e);outline-offset:1px}
.opts{display:grid;gap:8px}.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fbfdfb}
.opt:has(input:checked){border-color:var(--e);background:#e8f4ee}.opt input:not([type=text]){accent-color:var(--e);width:18px;height:18px;flex:none}
.opt input[type=text]{margin:0;padding:6px 8px;font-size:14px;flex:1;min-width:0}
.msg{border-radius:10px;padding:12px 14px;margin:12px 0;font-size:14px}.err{background:#fdecea;color:#8a1c12}
.done{background:#fff;border:1px solid var(--line);border-top:5px solid var(--o);border-radius:14px;padding:30px 22px;margin:30px 0;text-align:center}.done h1{color:var(--g);margin:0 0 8px}
footer{background:var(--g);color:#d1e3db;font-size:13px;padding:22px 0;margin-top:20px}footer b{color:#fff}

function qHTML(x,n){
 const nm=esc(n+". "+x.l);let b="";
 if(x.t==="t")b=`<input type="text" name="${nm}" ${x.r?"required":""} autocomplete="off">`;
 else if(x.t==="a")b=`<textarea name="${nm}" rows="4"></textarea>`;
 else if(x.t==="k")b=`<input type="text" name="Contact name" placeholder="Your name" autocomplete="name"><input type="tel" name="Phone / WhatsApp" placeholder="Phone or WhatsApp number" autocomplete="tel"><input type="email" name="Email" placeholder="Email address (optional)" autocomplete="email">`;
 else{const r=x.t==="r";b=`<div class="opts" data-max="${x.max||0}">`+x.o.map(o=>`<label class="opt"><input type="${r?"radio":"checkbox"}" name="${nm}" value="${esc(o)}" ${r&&x.r?"required":""}><span>${esc(o)}</span>${o==="Other"?`<input type="text" name="${nm} (other)" placeholder="Please specify">`:""}</label>`).join("")+`</div>`}
 const hint=x.h||(x.t==="c"?(x.max?`Select up to ${x.max}.`:"Select all that apply."):"");
 return `<div class="q"><span class="t">${n}. ${esc(x.l)}${x.r?' <b class="req">*</b>':""}</span>${hint?`<p class="hint">${esc(hint)}</p>`:""}${b}</div>`;
}
function home(){
 $("app").innerHTML=`<section class="hero"><div class="wrap"><span class="tag">Your voice matters</span><h1>Help shape Hub by PGMC</h1><p>Hub by PGMC is a local online marketplace for Malamulele and the surrounding villages. Choose the survey that fits you. Each one takes about 5 minutes.</p></div></section><div class="wrap"><div class="cards">`+
 Object.entries(S).map(([k,v])=>`<a class="card" href="#/${k}"><h2>${v.name.replace(" survey","s").replace("Delivery partner s","Delivery partners")}</h2><p>${v.card}</p><span class="btn">Start · ${v.mins}</span></a>`).join("")+`</div><p class="note">Your answers are used only to plan Hub by PGMC. Questions marked * must be answered. Everything else is optional.</p></div>`;
}
function survey(k){
 const v=S[k];let n=0;
 $("app").innerHTML=`<div class="wrap"><div class="sv-head"><a href="#/">← All surveys</a><h1>${esc(v.title)}</h1><p>${esc(v.intro)}</p><p>Estimated time: ${v.mins}</p></div><form id="svForm">`+
 v.secs.map(s=>`<section class="sec"><h2>${esc(s.s)}</h2>`+s.q.map(x=>qHTML(x,++n)).join("")+`</section>`).join("")+
 `<input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off"><div id="svMsg"></div><button class="btn" type="submit" id="svBtn">Submit survey</button><p class="note" style="margin-top:12px">By submitting, you agree that Pure Grace Multi-Corp may use your answers to plan Hub by PGMC and contact you if you gave contact details.</p></form></div>`;
 $("svForm").addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target,d={};
  for(const [key,val] of new FormData(f).entries()){const t=String(val).trim();if(key==="_honey"||!t)continue;d[key]=d[key]?d[key]+", "+t:t}
  d.Survey=v.name;d._subject="Hub by PGMC: new "+v.name+" response";d._template="table";d._honey="";if(d.Email)d._replyto=d.Email;
  const btn=$("svBtn");btn.disabled=true;btn.textContent="Sending...";$("svMsg").innerHTML="";
  try{
   const r=await fetch("https://formsubmit.co/ajax/"+FORM_EMAIL,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(d)});
   if(!r.ok)throw 0;
   $("app").innerHTML=`<div class="wrap"><div class="done"><h1>Thank you!</h1><p>Your answers have been sent. ${esc(v.thanks)}</p><a class="btn" href="#/">Back to surveys</a></div></div>`;window.scrollTo(0,0);
  }catch(x){btn.disabled=false;btn.textContent="Submit survey";$("svMsg").innerHTML=`<div class="msg err">Your answers could not be sent. Check your internet connection and try again.</div>`}
 });
}
document.addEventListener("change",e=>{const t=e.target,g=t.closest&&t.closest(".opts");if(!g||t.type!=="checkbox")return;const m=+g.dataset.max;if(m&&g.querySelectorAll("input[type=checkbox]:checked").length>m){t.checked=false;const h=g.previousElementSibling;if(h)h.style.color="#b3261e"}});
document.addEventListener("input",e=>{const t=e.target;if(t.type==="text"&&t.closest(".opt")){const i=t.closest(".opt").querySelector("input:not([type=text])");if(t.value&&i&&!i.checked&&(i.type==="radio"||!i.closest(".opts").dataset.max||i.closest(".opts").querySelectorAll("input[type=checkbox]:checked").length<+i.closest(".opts").dataset.max))i.checked=true}});
function route(){const k=location.hash.replace("#/","");if(S[k]){survey(k);document.title=S[k].name+" | Hub by PGMC"}else{home();document.title="Hub by PGMC | Surveys"}window.scrollTo(0,0)}
window.addEventListener("hashchange",route);route();
</script></body></html>
